[pytest]
# Pytest configuration for conference-abstract-builder

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may use moto/mocks)
    e2e: End-to-end tests (may require real AWS)
    slow: Tests that take longer than 10 seconds

# Logging
log_cli = false
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout (requires pytest-timeout)
# timeout = 60

# Coverage (requires pytest-cov)
# Run with: pytest --cov=packages --cov-report=html
